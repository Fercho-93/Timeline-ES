<!doctype html>
<!-- La página principal del juego: el esqueleto que abre el navegador y que carga, en orden, el resto de archivos. -->
<html lang="es">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-title" content="Continuum" />
    <meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18110b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Juego de ordenar: historia, entretenimiento, ciencia y geografía" />
    <!-- El SDK de Firebase va dentro del juego (vendor/firebase/). De fuera solo llegan los
         scripts de reCAPTCHA de App Check (www.google.com/recaptcha y www.gstatic.com), y el
         juego habla con las APIs de Google (autenticación, Firestore y Functions) bajo
         googleapis.com, cloudfunctions.net y run.app; el resto de la aplicación —incluida la
         carga de todos los mazos— es de este origen.
         `frame-ancestors` no se puede fijar aquí: los navegadores solo la respetan si la
         manda una cabecera HTTP de verdad, y GitHub Pages no permite añadir cabeceras. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com/recaptcha/; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net https://*.run.app; frame-src https://timeline-es.firebaseapp.com https://accounts.google.com https://appleid.apple.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/continuum-splash-blue-v5.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="stylesheet" href="css/splash.css?v=793" />
    <link rel="stylesheet" href="css/styles.css?v=793" />
    <link rel="stylesheet" href="css/edition.css?v=821" />

    <div id="app-splash" aria-hidden="true">

      <i class="splash-curtain" aria-hidden="true"></i>

        <i class="splash-sunbeam"></i>
        <i class="splash-sparkles"></i>
      </div>
      <div class="splash-floating-cards" aria-hidden="true">
        <figure class="splash-float-card splash-card-tl"><img src="assets/splash-card-marathon.webp" alt="" /></figure>
        <figure class="splash-float-card splash-card-tr"><img src="assets/splash-card-hippocrates.webp" alt="" /></figure>
        <figure class="splash-float-card splash-card-mr"><img src="assets/splash-card-vesuvius.webp" alt="" /></figure>
      </div>
      <section class="home-masthead splash-masthead">
        <div class="home-crest splash-crest">
          <i class="splash-halo" aria-hidden="true"></i>
          <i class="splash-swirl" aria-hidden="true"></i>
          <div class="splash-crest-in">
            <div class="splash-coin">
              <i class="splash-coin-edge" style="--z:-2px"><img src="assets/continuum-emblem-800.webp" alt="" width="800" height="533" /></i>
              <i class="splash-coin-edge" style="--z:-1px"><img src="assets/continuum-emblem-800.webp" alt="" width="800" height="533" /></i>
              <i class="splash-coin-edge" style="--z:0px"><img src="assets/continuum-emblem-800.webp" alt="" width="800" height="533" /></i>
              <i class="splash-coin-edge" style="--z:1px"><img src="assets/continuum-emblem-800.webp" alt="" width="800" height="533" /></i>
              <i class="splash-coin-edge" style="--z:2px"><img src="assets/continuum-emblem-800.webp" alt="" width="800" height="533" /></i>
              <div class="splash-coin-face splash-coin-back"><img src="assets/continuum-emblem-800.webp" alt="" width="800" height="533" /></div>
              <div class="splash-coin-face">
                <img src="assets/continuum-emblem-800.webp" alt="" width="800" height="533" decoding="sync" fetchpriority="high" />
                <i class="splash-glint" aria-hidden="true"></i>
              </div>
            </div>
          </div>
        </div>
        <div class="home-wordmark"><span>C</span><span>o</span><span>n</span><span>t</span><span>i</span><span>n</span><span>u</span><span>u</span><span>m</span></div>
        <div class="home-tagline"><span>Ordena.</span> <span>Compara.</span> <span>Acierta.</span></div>
        <div class="home-ornament" aria-hidden="true"><span></span><i></i><span></span></div>
        <div class="splash-hitos" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </section>
