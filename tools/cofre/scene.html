<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const renderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(640,560);renderer.setPixelRatio(1);renderer.setClearColor(0,0);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.88;document.body.append(renderer.domElement);
const scene=new T.Scene();const camera=new T.PerspectiveCamera(32,640/560,.1,100);
camera.position.set(3.1,3.0,7.0);camera.lookAt(0,1.25,0);
const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.add(new T.HemisphereLight(0xc4d7e1,0x3a2415,1.4));
const sun=new T.DirectionalLight(0xffdfaa,4.3);sun.position.set(-4,6,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.1,far:20});sun.shadow.normalBias=.025;sun.shadow.bias=-.00015;sun.shadow.radius=4;scene.add(sun);
const fill=new T.DirectionalLight(0xa3bed0,.75);fill.position.set(3,2,-4);scene.add(fill);
const loader=new T.TextureLoader();const source=await loader.loadAsync('/assets/cofre-oak-v1.webp');source.colorSpace=T.SRGBColorSpace;source.wrapS=source.wrapT=T.RepeatWrapping;source.anisotropy=8;
let seed=83;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const canvas=document.createElement('canvas');canvas.width=canvas.height=256;const ctx=canvas.getContext('2d');const pixels=ctx.createImageData(256,256);
for(let i=0;i<pixels.data.length;i+=4){const n=random(),v=n>.985?50:150+Math.floor(n*65);pixels.data.set([v,v,v,255],i);}ctx.putImageData(pixels,0,0);const patina=new T.CanvasTexture(canvas);patina.wrapS=patina.wrapT=T.RepeatWrapping;
const brass=new T.MeshStandardMaterial({color:0x796449,metalness:.78,roughness:.57,roughnessMap:patina,bumpMap:patina,bumpScale:.012,envMapIntensity:.55});
const iron=new T.MeshStandardMaterial({color:0x342e26,metalness:.72,roughness:.64,envMapIntensity:.45});
const inner=new T.MeshStandardMaterial({map:source,color:0x56412d,roughness:.92,envMapIntensity:.3});
const woods=Array.from({length:8},(_,i)=>{const map=source.clone();map.repeat.set(1.1,.24);map.offset.set(i*.119,i*.137);return new T.MeshStandardMaterial({map,color:new T.Color().setRGB(.36+i*.009,.31+i*.006,.25+i*.004),roughness:.76,bumpMap:map,bumpScale:.012,envMapIntensity:.4});});
const mesh=(geo,mat,parent=scene,x=0,y=0,z=0)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m;};
const box=(w,h,d,mat,parent,x,y,z,r=.014)=>mesh(new RoundedBoxGeometry(w,h,d,2,r),mat,parent,x,y,z);
const chest=new T.Group();scene.add(chest);chest.rotation.y=-.10;
const W=2.8,D=1.55,H=1.08,RY=.59;
// Real thickness, separate boards and an interior that stays visible after opening.
for(let j=0;j<4;j++)for(const z of [-D/2,D/2])box(W-.04,H/4-.009,.085,woods[j],chest,0,.12+(j+.5)*H/4,z);
for(let j=0;j<4;j++)for(const x of [-W/2,W/2])box(.085,H/4-.009,D+.03,woods[j+3],chest,x,.12+(j+.5)*H/4,0);
box(W,.10,D,inner,chest,0,.14,0);
for(const x of [-W/2,W/2])box(.10,.09,D+.08,brass,chest,x,H+.1,0);
for(const z of [-D/2,D/2])box(W,.085,.10,brass,chest,0,H+.1,z);
const rivetGeo=new T.SphereGeometry(.022,10,6);
const rivet=(parent,x,y,z)=>mesh(rivetGeo,brass,parent,x,y,z);
for(const x of [-1.00,1.00]){
 for(const z of [-D/2-.052,D/2+.052]){box(.115,H+.02,.03,brass,chest,x,H/2+.12,z);for(const y of [.26,.55,.86,1.11])rivet(chest,x,y,z+(z>0?.025:-.025));}
 box(.12,.05,D+.12,iron,chest,x,.115,0);
}
// Forged side handles with mounting plates and naturally dark recesses.
for(const x of [-W/2-.06,W/2+.06]){
 box(.035,.22,.54,iron,chest,x,.65,0);
 const handle=mesh(new T.TorusGeometry(.18,.025,8,28,Math.PI*1.65),brass,chest,x*1.025,.60,0);handle.rotation.y=Math.PI/2;handle.scale.y=.7;
}
const hinge=new T.Group();hinge.position.set(0,H+.12,-D/2);chest.add(hinge);
const lid=new T.Group();lid.position.z=D/2;hinge.add(lid);
function arch(width,ry,rz,material,parent,flip=false,ox=0){
 const pos=[],uv=[],ind=[],N=48;
 for(let i=0;i<=N;i++){const a=i/N*Math.PI;for(const x of [-width/2,width/2]){pos.push(x+ox,ry*Math.sin(a),rz*Math.cos(a));uv.push(x/width+.5,i/N*.5);}}
 for(let i=0;i<N;i++){const a=i*2;ind.push(...(flip?[a,a+2,a+1,a+1,a+2,a+3]:[a,a+1,a+2,a+1,a+3,a+2]));}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setIndex(ind);g.computeVertexNormals();return mesh(g,material,parent);
}
arch(W+.07,RY,D/2+.025,woods[5],lid);arch(W-.10,RY-.065,D/2-.045,inner,lid,true);
for(const x of [-W/2,W/2]){
 const shape=new T.Shape();shape.moveTo(-D/2,0);for(let i=0;i<=48;i++){const a=i/48*Math.PI;shape.lineTo(-D/2*Math.cos(a),RY*Math.sin(a));}shape.closePath();
 const cap=mesh(new T.ShapeGeometry(shape),woods[6],lid,x,0,0);cap.rotation.y=x>0?Math.PI/2:-Math.PI/2;cap.material=woods[6].clone();cap.material.side=T.DoubleSide;
}
for(const x of [-1,1]){arch(.12,RY+.016,D/2+.042,brass,lid,false,x);for(let i=1;i<8;i++){const a=i/8*Math.PI;rivet(lid,x,(RY+.035)*Math.sin(a),(D/2+.055)*Math.cos(a));}}
// Fine seams follow the arc rather than drawing dark straight lines through the wood.
for(let i=1;i<9;i++){const a=i/9*Math.PI;box(W+.07,.011,.012,inner,lid,0,RY*Math.sin(a)+.003,(D/2+.029)*Math.cos(a),.003);}
for(const x of [-1,1]){const pin=mesh(new T.CylinderGeometry(.043,.043,.30,16),brass,chest,x,H+.12,-D/2-.035);pin.rotation.z=Math.PI/2;box(.16,.20,.025,iron,chest,x,H+.01,-D/2-.065);}
// A small embossed emblem sits on the front, flush with its metal plate.
const badge=mesh(new T.CylinderGeometry(.19,.19,.018,48),brass,chest,0,.71,D/2+.071);badge.rotation.x=Math.PI/2;
const logo=await loader.loadAsync('/assets/continuum-emblem-800.webp');logo.colorSpace=T.SRGBColorSpace;
mesh(new T.PlaneGeometry(.32,.22),new T.MeshStandardMaterial({map:logo,transparent:true,color:0x997d4e,roughness:.68,metalness:.35,depthWrite:false}),chest,0,.71,D/2+.084);
const lock=new T.Group();lock.position.set(0,H+.10,D/2+.095);chest.add(lock);
box(.11,.27,.028,iron,lid,0,-.035,D/2+.06);
box(.20,.22,.085,brass,lock,0,-.24,0,.03);
const shackle=mesh(new T.TorusGeometry(.069,.014,8,24,Math.PI),iron,lock,0,-.11,0);shackle.rotation.z=0;
box(.026,.048,.008,iron,lock,0,-.25,.046,.008);
// The shadow is rendered with the same light as the chest and composited on the deck.
const floor=mesh(new T.PlaneGeometry(200,200),new T.ShadowMaterial({opacity:.32}),scene,0,.005,0);floor.rotation.x=-Math.PI/2;floor.castShadow=false;
const glow=new T.PointLight(0xffd58c,0,3,2);glow.position.set(0,1.3,.15);chest.add(glow);
const smooth=t=>{t=Math.min(1,Math.max(0,t));return t*t*(3-2*t);};
window.drawChest=(time)=>{
 const unlock=smooth(time/.42),fall=Math.min(1,Math.max(0,(time-.32)/.55))**2,open=smooth((time-.54)/1.28);
 lock.position.y=H+.10-fall*1.09;lock.position.x=fall*.52;lock.position.z=D/2+.095+fall*.38;lock.rotation.z=-fall*.10;lock.rotation.x=-fall*1.52;
 shackle.rotation.z=-unlock*.4;shackle.position.y=-.11+unlock*.035;
 // A single rigid lid rotates on the actual rear hinge. Slow start, weight, settled stop.
 hinge.rotation.x=-open*1.78 + (time>1.82&&time<2.1 ? Math.sin((time-1.82)/.28*Math.PI)*.012:0);
 glow.intensity=smooth((time-.98)/.85)*1.8;
 renderer.render(scene,camera);
};
window.drawChest(0);window.chestReady=true;
</script>
