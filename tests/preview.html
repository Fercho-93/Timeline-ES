<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Continuum · revisión de móvil</title>
<style>
  body { margin: 24px; background: #ddd9d2; font: 15px system-ui; }
  nav { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
  select { font: inherit; padding: 8px; }
  iframe { display: block; border: 0; width: 390px; height: 844px; background: #f7f5f1; box-shadow: 0 12px 40px #0002; }
</style>
<nav><label for="size">Ancho de pantalla</label><select id="size"><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1080</option></select><span>Prueba responsive en navegador; no emula Safari ni hardware táctil.</span></nav>
<iframe title="Juego en móvil" src="../index.html"></iframe>
<script>
  document.querySelector('select').addEventListener('change', event => {
    document.querySelector('iframe').style.width = `${event.target.value}px`;
  });
</script>
</html>
