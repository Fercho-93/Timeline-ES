name: Pruebas

# En cada propuesta de cambio y en cada subida a main. Los dos trabajos van por
# separado para que el fallo señale de qué se trata: el juego o las reglas.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  juego:
    name: Juego, mazos y service worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  movil:
    name: Build móvil (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Comprueba que Android e iPhone siguen aceptando el build actual sin tocar los
      # proyectos nativos ya generados (los mismos que hay en android/ e ios/).
      - run: npx cap sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar Android
        working-directory: android
        run: bash gradlew assembleDebug
      # Google Play no admite un módulo base de más de 200 MB comprimidos. El APK de depuración es
      # una buena aproximación: aquí solo se informa (no bloquea), para ver el tamaño en cada subida.
      - name: Tamaño del paquete de Android
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          bytes=$(stat -c%s "$apk")
          mb=$(awk -v b="$bytes" 'BEGIN{printf "%.1f", b/1000000}')
          mib=$(awk -v b="$bytes" 'BEGIN{printf "%.1f", b/1048576}')
          echo "APK de depuración: $mb MB ($mib MiB, $bytes bytes). Límite de Google Play para el módulo base: 200 MB." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt 200000000 ]; then echo "::warning::El APK de Android pesa $mb MB: supera los 200 MB del módulo base de Google Play."; fi
      - uses: actions/upload-artifact@v5
        with:
          name: Continuum-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  iphone:
    name: Compilar iPhone sin firma
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Verificar SDK y compilar
        working-directory: ios/App
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  reglas:
    name: Reglas de Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # El emulador de Firestore es un programa Java, así que hace falta una JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:reglas
