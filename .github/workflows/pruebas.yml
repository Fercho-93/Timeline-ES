name: Pruebas

# En cada propuesta de cambio y en cada subida a main. Los dos trabajos van por
# separado para que el fallo señale de qué se trata: el juego o las reglas.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  juego:
    name: Juego, mazos y service worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  movil:
    name: Build móvil (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Comprueba que Android e iPhone siguen aceptando el build actual sin tocar los
      # proyectos nativos ya generados (los mismos que hay en android/ e ios/).
      - run: npx cap sync

  reglas:
    name: Reglas de Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # El emulador de Firestore es un programa Java, así que hace falta una JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:reglas
