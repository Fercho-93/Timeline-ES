name: Preparar beta firmada
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        required: true
        type: choice
        options: [android, ios]
      upload_testflight:
        description: Subir el IPA a TestFlight
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    if: inputs.platform == 'android'
    environment: android-beta
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/continuum.jks
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CONTINUUM_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar firma temporal
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" && test -n "$ANDROID_STORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: bash gradlew bundleRelease assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Continuum-Android-beta-firmada
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7
      - name: Limpiar firma
        if: always()
        run: rm -f -- "$ANDROID_KEYSTORE_PATH"
  ios:
    if: inputs.platform == 'ios'
    environment: ios-beta
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_PROFILE_NAME: ${{ vars.APPLE_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verificar identificación de firma
        run: test -n "$APPLE_TEAM_ID" && test -n "$APPLE_PROFILE_NAME"
      - uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
      - uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.continuum.game
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Configurar firma de App
        run: |
          ruby -rxcodeproj -e 'p=Xcodeproj::Project.open("ios/App/App.xcodeproj"); p.targets.select{|t|t.name=="App"}.each{|t|t.build_configurations.each{|c|c.build_settings["CODE_SIGN_STYLE"]="Manual";c.build_settings["DEVELOPMENT_TEAM"]=ENV.fetch("APPLE_TEAM_ID");c.build_settings["PROVISIONING_PROFILE_SPECIFIER"]=ENV.fetch("APPLE_PROFILE_NAME");c.build_settings["CODE_SIGN_IDENTITY"]="Apple Distribution"}};p.save'
          python3 -c 'import os,plistlib; plistlib.dump({"method":"app-store-connect","signingStyle":"manual","teamID":os.environ["APPLE_TEAM_ID"],"provisioningProfiles":{"com.continuum.game":os.environ["APPLE_PROFILE_NAME"]}},open("ExportOptions.plist","wb"))'
      - name: Compilar y exportar IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Continuum.xcarchive" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Continuum.xcarchive" -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/continuum-export"
      - uses: actions/upload-artifact@v4
        with:
          name: Continuum-iPhone-beta-firmada
          path: ${{ runner.temp }}/continuum-export/*.ipa
          retention-days: 7
