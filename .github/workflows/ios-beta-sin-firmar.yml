name: iPhone beta (sin firmar)

# No hace falta un Mac para conseguir el .ipa: este trabajo compila la app de iPhone en un
# runner de GitHub (que sí trae macOS y Xcode) y deja el resultado descargable como artefacto
# de la ejecución. El .ipa que produce no está firmado por Apple, así que no sirve para
# App Store ni TestFlight, pero sí para instalarlo directamente en un iPhone con una
# herramienta como Sideloadly (Windows/Mac/Linux) y una cuenta gratuita de Apple.
#
# Se lanza a mano desde la pestaña "Actions" de GitHub (botón "Run workflow"), no en cada
# cambio: compilar para iPhone en un runner macOS es lento y consume minutos de un cupo
# mensual limitado.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar App.ipa sin firmar
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Instalar dependencias nativas (CocoaPods)
        working-directory: ios/App
        run: pod install
      - name: Compilar sin firma de código
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Empaquetar App.app en un .ipa sin firmar
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Continuum-sin-firmar.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Continuum-iOS-sin-firmar
          path: ios/App/Continuum-sin-firmar.ipa
          retention-days: 14
