name: Zoom visual móvil
on:
  push:
    branches: [main, codex/visual-v196]
    paths:
      - 'mapa.js'
      - 'drag.js'
      - 'a11y.js'
      - 'app.js'
      - 'online.js'
      - 'immersion.js'
      - 'effects.js'
      - '*.css'
      - 'tests/zoom-browser.mjs'
      - 'tests/online-e2e.mjs'
      - 'tests/transitions-browser.mjs'
      - '.github/workflows/zoom-visual.yml'
  pull_request:
    paths: ['mapa.js', '*.css', 'tests/zoom-browser.mjs', '.github/workflows/zoom-visual.yml']
permissions:
  contents: read
jobs:
  zoom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --prefix "$RUNNER_TEMP/zoom-browser" --ignore-scripts playwright@1.62.1
          ln -s "$RUNNER_TEMP/zoom-browser/node_modules" node_modules
      - run: npx playwright install --with-deps webkit chromium
      - run: node tests/board-fit-browser.mjs
      - run: node tests/entry-board-browser.mjs
      - run: node tests/turn-duel-layout-browser.mjs
      - run: node tests/zoom-browser.mjs
      - run: node tests/transitions-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoom-mobile-measurements
          path: |
            test-results/zoom/
            test-results/transitions/
          retention-days: 7
  online-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/online-browser" --ignore-scripts playwright@1.62.1
      - run: "$RUNNER_TEMP/online-browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: mkdir -p test-results/online
      - run: npm run test:online-e2e
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/online-browser/node_modules/playwright/index.mjs
          SHOTS: test-results/online
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-mobile-measurements
          path: test-results/online/
          retention-days: 7
