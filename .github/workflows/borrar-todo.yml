name: Borrar todos los datos (lanzamiento)

# Para el día de publicar en la App Store: borra TODAS las cuentas (invitados y vinculadas con Apple) y TODOS los
# datos de Firestore, menos el cartel remoto (`appConfig`), para empezar de cero. No hay vuelta atrás.
# Solo se lanza a mano: pestaña Actions -> «Borrar todos los datos (lanzamiento)» -> «Run workflow».
#
# Dos pasos a propósito: la primera vez, con «simulacro» activado, solo cuenta lo que hay. Para borrar de verdad
# hay que desmarcar «simulacro» y escribir BORRAR TODO en la confirmación.
#
# Antes de lanzarlo: tener subida la versión con la temporada nueva (`SEASON` = launch-2) y cerrada la beta.
# Usa la credencial de las Functions (FIREBASE_SERVICE_ACCOUNT); necesita poder borrar usuarios de Authentication.
on:
  workflow_dispatch:
    inputs:
      simulacro:
        description: Simulacro (solo cuenta, no borra nada). Desmárcalo para borrar de verdad
        required: true
        type: boolean
        default: true
      confirmacion:
        description: Para borrar de verdad, escribe BORRAR TODO
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: borrar-todo
  cancel-in-progress: false

jobs:
  borrar:
    name: Borrar todo
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar la confirmación
        env:
          SIMULACRO: ${{ inputs.simulacro }}
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          if [ "$SIMULACRO" != "true" ] && [ "$CONFIRMACION" != "BORRAR TODO" ]; then
            echo "Para borrar de verdad hay que escribir exactamente BORRAR TODO. No se ha borrado nada." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar las dependencias de las Functions
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Escribir la credencial
        env:
          CUENTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CUENTA" ]; then
            echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT del repositorio." >&2
            exit 1
          fi
          printf '%s' "$CUENTA" > "$RUNNER_TEMP/cuenta.json"
      - name: Borrar
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cuenta.json
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          if [ "$SIMULACRO" = "true" ]; then node scripts/borrar-todo.mjs; else node scripts/borrar-todo.mjs --borrar; fi
      - name: Borrar la credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/cuenta.json"
